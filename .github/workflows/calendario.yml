name: Actualizar calendario Marianistas

on:
  schedule:
    # Lunes y jueves a las 06:15 UTC.
    # OJO: cron en Actions es SIEMPRE UTC, no cambia con el horario de verano.
    # En invierno son las 07:15 en España; en verano, las 08:15.
    - cron: "15 6 * * 1,4"
  workflow_dispatch:        # permite lanzarlo a mano desde la pestaña Actions
  push:
    paths:
      - "rfaf_calendario.py"   # si tocas el scraper, regenera al vuelo

# Sin esto el bot no puede commitear: el token es de solo lectura por defecto.
permissions:
  contents: write

concurrency:
  group: calendario
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4

      - name: Ejecutar scraper
        run: |
          python rfaf_calendario.py
          mkdir -p docs
          mv marianistas.ics marianistas.json docs/

      - name: Verificar que el resultado tiene sentido
        run: |
          # Si la RFAF cambia el HTML, el scraper podría devolver 0 partidos
          # sin fallar. Mejor romper aquí que publicar un calendario vacío
          # y borrar en silencio los eventos que ya tenías en el móvil.
          n=$(grep -c "BEGIN:VEVENT" docs/marianistas.ics || true)
          echo "Eventos encontrados: $n"
          if [ "$n" -lt 25 ]; then
            echo "::error::Solo $n eventos (esperados ~30). Aborto sin publicar."
            exit 1
          fi

      - name: Commitear si hay cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # DTSTAMP cambia en cada ejecución, así que el fichero SIEMPRE
          # difiere aunque los partidos sean idénticos. Comparamos ignorando
          # esa línea para no generar un commit inútil cada lunes.
          if git diff --quiet -I '^DTSTAMP:' -- docs/; then
            echo "Sin cambios reales en el calendario."
            exit 0
          fi

          git add docs/
          git commit -m "Calendario actualizado: $(date -u +%Y-%m-%d)"
          git push
