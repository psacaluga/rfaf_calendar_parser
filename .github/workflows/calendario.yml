name: Actualizar calendario Xerez Deportivo B

on:
  schedule:
    - cron: "15 6 * * 1,4"
  workflow_dispatch:
  push:
    paths:
      - "rfaf_calendario.py"

permissions:
  contents: write

concurrency:
  group: calendario
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4

      - name: Ejecutar scraper
        run: |
          python rfaf_calendario.py
          salida="xerez-deportivo-b-$(date -u +%Y-%m-%d)"
          cp "docs/$salida/xerez-deportivo-b.ics" "docs/xerez-deportivo-b.ics"
          cp "docs/$salida/xerez-deportivo-b.json" "docs/xerez-deportivo-b.json"

      - name: Verificar que el resultado tiene sentido
        run: |
          n=$(grep -c "BEGIN:VEVENT" docs/xerez-deportivo-b.ics || true)
          echo "Eventos encontrados: $n"
          if [ "$n" -lt 25 ]; then
            echo "::error::Solo $n eventos (esperados ~30). Aborto sin publicar."
            exit 1
          fi

      - name: Commitear si hay cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Avisamos si algo esta ignorando docs/ (plantillas de .gitignore
          # como la de Python o Jekyll suelen incluir reglas sobre 'docs').
          if git check-ignore -v docs/xerez-deportivo-b.ics; then
            echo "::warning::docs/ esta en .gitignore (linea de arriba). Forzando."
          fi

          # -f para saltarse .gitignore. Sin esto 'git add' no anade nada,
          # el diff no ve cambios y el workflow termina en verde sin publicar.
          git add -f docs/

          echo "--- estado tras el add ---"
          git status --short

          # Red de seguridad: si no hay NADA en el indice, algo va mal.
          # Preferimos fallar visiblemente a terminar en verde sin publicar.
          if git diff --cached --quiet && [ -z "$(git ls-files docs/)" ]; then
            echo "::error::No se ha podido anadir docs/ al indice."
            exit 1
          fi

          # Ignoramos DTSTAMP, que cambia en cada ejecucion y generaria
          # un commit inutil cada vez aunque los partidos sean identicos.
          if git diff --cached --quiet -I '^DTSTAMP:'; then
            echo "Sin cambios reales en el calendario (ya estaba publicado)."
            exit 0
          fi

          git commit -m "Calendario actualizado: $(date -u +%Y-%m-%d)"
          git push
          echo "Publicado en docs/xerez-deportivo-b.ics"
