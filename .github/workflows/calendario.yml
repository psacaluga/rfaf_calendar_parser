name: Actualizar calendario Marianistas

on:
  schedule:
    # Lunes y jueves a las 06:15 UTC (el cron de Actions es siempre UTC).
    - cron: "15 6 * * 1,4"
  workflow_dispatch:
  push:
    paths:
      - "rfaf_calendario.py"

permissions:
  contents: write

concurrency:
  group: calendario
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      # v5 / v6 ya corren sobre Node 24: eliminan el aviso de deprecacion.
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4

      - name: Ejecutar scraper
        run: |
          python rfaf_calendario.py
          mkdir -p docs
          mv marianistas.ics marianistas.json docs/

      - name: Verificar que el resultado tiene sentido
        run: |
          n=$(grep -c "BEGIN:VEVENT" docs/marianistas.ics || true)
          echo "Eventos encontrados: $n"
          if [ "$n" -lt 25 ]; then
            echo "::error::Solo $n eventos (esperados ~30). Aborto sin publicar."
            exit 1
          fi

      - name: Commitear si hay cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # IMPORTANTE: 'git add' ANTES de comparar.
          # 'git diff' a secas ignora los ficheros no rastreados, asi que en la
          # primera ejecucion no veia docs/ (recien creado), concluia "sin
          # cambios" y terminaba en verde sin publicar nada.
          git add docs/

          # Comparamos contra el indice ignorando DTSTAMP, que cambia en cada
          # ejecucion y provocaria un commit inutil cada lunes.
          if git diff --cached --quiet -I '^DTSTAMP:'; then
            echo "Sin cambios reales en el calendario."
            exit 0
          fi

          git commit -m "Calendario actualizado: $(date -u +%Y-%m-%d)"
          git push
